# Safety net for every pull request (and main). Mirrors the validation gate in
# .ai/agentic.config.json; each job is a separate status check on the PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Design tokens: no palette classes or arbitrary values outside globals.css (tokeny.md).
      - run: npm run check:tokens
      # Dry-run tests of the agent PreToolUse hook (.claude/hooks/); not under the unit coverage gate.
      - run: npm run test:hooks
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build must not need a database or runtime secrets.
      - run: npm run build

  integration:
    name: Integration tests (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E tests (app + PostgreSQL + agent-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install agent-browser (pinned, checksum-verified)
        run: bash .ai/scripts/ensure-agent-browser.sh
      - run: npm run test:e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: packages/app/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  storybook:
    name: Storybook (build + stories in both themes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium for the Vitest browser mode that runs every story (a11y as errors, play functions).
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:storybook:themes
      # The built Storybook, so a reviewer can open the design system without a local install.
      - name: Upload the built Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/app/storybook-static/
          if-no-files-found: ignore
          retention-days: 7
