# Weekly update PRs for npm dependencies and for the GitHub Actions used in .github/workflows/.
# Security alerts are enabled in the repository settings; this file sets the update schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 is not supported by typescript-eslint yet (lint fails). Revisit when it is.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
